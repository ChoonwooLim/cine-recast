<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="CineRecast: same shots, new cast, new backdrop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b2a44"/>
    </linearGradient>
    <linearGradient id="skyA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6b7f"/>
      <stop offset="1" stop-color="#2c3848"/>
    </linearGradient>
    <linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6b56b"/>
      <stop offset="1" stop-color="#b2493f"/>
    </linearGradient>
    <clipPath id="frameA"><rect x="640" y="96" width="232" height="132" rx="6"/></clipPath>
    <clipPath id="frameB"><rect x="916" y="96" width="232" height="132" rx="6"/></clipPath>
  </defs>

  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>

  <!-- film perforations -->
  <g fill="#ffffff" opacity="0.10">
    <g id="holes">
      <rect x="28" y="18" width="26" height="16" rx="4"/><rect x="84" y="18" width="26" height="16" rx="4"/>
      <rect x="140" y="18" width="26" height="16" rx="4"/><rect x="196" y="18" width="26" height="16" rx="4"/>
      <rect x="252" y="18" width="26" height="16" rx="4"/><rect x="308" y="18" width="26" height="16" rx="4"/>
      <rect x="364" y="18" width="26" height="16" rx="4"/><rect x="420" y="18" width="26" height="16" rx="4"/>
      <rect x="476" y="18" width="26" height="16" rx="4"/><rect x="532" y="18" width="26" height="16" rx="4"/>
      <rect x="588" y="18" width="26" height="16" rx="4"/><rect x="644" y="18" width="26" height="16" rx="4"/>
      <rect x="700" y="18" width="26" height="16" rx="4"/><rect x="756" y="18" width="26" height="16" rx="4"/>
      <rect x="812" y="18" width="26" height="16" rx="4"/><rect x="868" y="18" width="26" height="16" rx="4"/>
      <rect x="924" y="18" width="26" height="16" rx="4"/><rect x="980" y="18" width="26" height="16" rx="4"/>
      <rect x="1036" y="18" width="26" height="16" rx="4"/><rect x="1092" y="18" width="26" height="16" rx="4"/>
      <rect x="1148" y="18" width="26" height="16" rx="4"/>
    </g>
    <use href="#holes" y="328"/>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Arial, sans-serif">
    <text x="64" y="150" font-size="74" font-weight="800" fill="#ffffff" letter-spacing="-1">Cine<tspan fill="#f6b56b">Recast</tspan></text>
    <text x="66" y="204" font-size="30" font-weight="600" fill="#e5ecf6">같은 장면, 새로운 배역과 배경</text>
    <text x="66" y="244" font-size="20" fill="#9fb0c8">Same shots. New cast. New backdrop.</text>
    <text x="66" y="296" font-size="16" fill="#7f91ab">숏 구성 · 카메라 · 동작 · 편집은 그대로 두고, 지정한 인물과 배경만 바꿔 다시 만듭니다</text>
  </g>

  <!-- reference frame -->
  <g clip-path="url(#frameA)">
    <rect x="640" y="96" width="232" height="132" fill="url(#skyA)"/>
    <path d="M640 206 L700 160 L748 190 L806 142 L872 196 L872 228 L640 228 Z" fill="#1f2a37"/>
    <circle cx="736" cy="150" r="17" fill="#c9d3df"/>
    <path d="M704 228 C704 190 718 172 736 172 C754 172 768 190 768 228 Z" fill="#c9d3df"/>
  </g>
  <rect x="640" y="96" width="232" height="132" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- arrow -->
  <g stroke="#f6b56b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M880 162 H906"/><path d="M898 153 L908 162 L898 171"/>
  </g>

  <!-- recast frame: same composition, new person and backdrop -->
  <g clip-path="url(#frameB)">
    <rect x="916" y="96" width="232" height="132" fill="url(#skyB)"/>
    <circle cx="1104" cy="126" r="16" fill="#fff3d6" opacity="0.9"/>
    <path d="M916 210 C960 176 1004 196 1040 178 C1080 158 1120 184 1148 170 L1148 228 L916 228 Z" fill="#6d2a3a"/>
    <circle cx="1012" cy="150" r="17" fill="#17324d"/>
    <path d="M980 228 C980 190 994 172 1012 172 C1030 172 1044 190 1044 228 Z" fill="#17324d"/>
  </g>
  <rect x="916" y="96" width="232" height="132" rx="6" fill="none" stroke="#f6b56b" stroke-width="2"/>

  <g font-family="'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Arial, sans-serif" font-size="15" font-weight="600">
    <text x="756" y="256" text-anchor="middle" fill="#9fb0c8">원본 · Reference</text>
    <text x="1032" y="256" text-anchor="middle" fill="#f6b56b">재제작 · Recast</text>
  </g>
</svg>
